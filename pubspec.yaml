name: skillswap
description: "SkillSwap - a community skill-exchange platform."
publish_to: 'none'

version: 1.0.2+2

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Networking
  dio: ^5.7.0
  stomp_dart_client: ^3.0.1

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Secure storage for JWT
  flutter_secure_storage: ^9.2.2

  # Utilities
  intl: ^0.19.0
  equatable: ^2.0.7
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true

  # Bundled locally (not fetched via google_fonts at runtime) so the app's
  # typography works offline and isn't subject to platform sandbox/network
  # restrictions blocking a first-launch font download.
  fonts:
    - family: Bricolage
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Variable.ttf
          weight: 500
        - asset: assets/fonts/BricolageGrotesque-Variable.ttf
          weight: 700
        - asset: assets/fonts/BricolageGrotesque-Variable.ttf
          weight: 800
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Variable.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Variable.ttf
          weight: 500
        - asset: assets/fonts/DMSans-Variable.ttf
          weight: 600
        - asset: assets/fonts/DMSans-Variable.ttf
          weight: 700
